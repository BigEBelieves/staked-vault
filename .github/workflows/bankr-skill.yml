name: Bankr skill
on:
  pull_request:
  push:
    branches: [feature/bankr-vault-skill]
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s test -p bankr_skill_test.py -v
      - run: python3 -m py_compile skills/staked-vault/scripts/plan.py
