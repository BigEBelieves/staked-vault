name: Recoverable BNKR sponsorship
on:
  pull_request:
  push:
    branches: [feature/bnkr-recoverable-sponsorship]
permissions:
  contents: read
jobs:
  sponsor-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:sponsor
      - run: node test/bnkr-staking.test.mjs
