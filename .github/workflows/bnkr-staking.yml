name: BNKR staking adapter
on:
  pull_request:
  push:
    branches: [feature/bnkr-staking-yield]
permissions:
  contents: read
jobs:
  staking-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:bnkr
      - run: node --test test/bnkr-deployment-page.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node --test test/bnkr-deployment-browser.test.mjs
