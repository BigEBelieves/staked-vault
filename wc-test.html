<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>wc test 2</title></head>
<body><pre id="out">starting</pre>
<script type="module">
const out = document.getElementById('out');
const L = (s) => { out.innerText += '\n' + s; };
try {
  const m = await import('https://esm.sh/@walletconnect/ethereum-provider@2.18.1');
  const wc = await m.EthereumProvider.init({
    projectId: '2f05ae7f1116030fde2d36508f472bfb',
    chains: [8453],
    optionalChains: [8453],
    showQrModal: true,
    rpcMap: { 8453: 'https://mainnet.base.org' },
    metadata: { name: 'test', description: 'test', url: location.origin, icons: [] }
  });
  L('init ok (showQrModal true)');
  wc.on('display_uri', (u) => L('display_uri ok len=' + u.length));
  wc.enable().catch((e) => L('enable ended: ' + (e && e.message)));
  await new Promise((r) => setTimeout(r, 6000));
  L('w3m-modal element present: ' + !!document.querySelector('w3m-modal'));
  L('w3m-router / qr present: ' + !!(document.querySelector('w3m-modal') && document.querySelector('w3m-modal').shadowRoot));
} catch (e) { L('FAIL ' + e.message); }
</script>
</body></html>
