<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>wc test</title></head>
<body><pre id="out">starting</pre>
<script>
window.__log = [];
function L(s){ window.__log.push(s); document.getElementById('out').innerText = window.__log.join('\n'); }
window.addEventListener('error', function(e){ L('window.error: ' + e.message + ' @' + (e.filename||'').slice(-50) + ':' + e.lineno); });
window.addEventListener('unhandledrejection', function(e){ L('unhandledrejection: ' + (e.reason && e.reason.message || e.reason)); });
L('origin=' + location.origin + ' localStorage=' + (function(){try{localStorage.setItem('t','1');return 'ok'}catch(e){return 'FAIL '+e.message}})());
</script>
<script src="https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.18.1/dist/index.umd.js" onload="L('UMD script onload')" onerror="L('UMD script onerror')"></script>
<script>
setTimeout(function(){
  var p = window['@walletconnect/ethereum-provider'];
  L('UMD global present=' + !!p + ' keys=' + (p ? Object.keys(p).join(',') : 'none') + ' init=' + (p && p.EthereumProvider ? typeof p.EthereumProvider.init : 'n/a'));
}, 1500);
</script>
<script type="module">
try {
  const m = await import('https://esm.sh/@walletconnect/ethereum-provider@2.18.1');
  L('ESM imported keys=' + Object.keys(m).join(','));
  const wc = await m.EthereumProvider.init({ projectId: '2f05ae7f1116030fde2d36508f472bfb', chains: [8453], showQrModal: false });
  L('ESM INIT OK enable=' + typeof wc.enable);
  wc.on('display_uri', function(uri){ L('ESM display_uri OK len=' + uri.length + ' prefix=' + uri.slice(0,12)); });
  wc.connect().catch(function(e){ L('connect() ended: ' + (e && e.message)); });
} catch (e) { L('ESM FAIL ' + e.message); }
</script>
</body></html>
